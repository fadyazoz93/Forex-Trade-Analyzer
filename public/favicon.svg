<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Badge Background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Subtle Analytical Grid -->
  <line x1="8" y1="32" x2="56" y2="32" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 2" stroke-opacity="0.6" />
  <line x1="8" y1="46" x2="56" y2="46" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 2" stroke-opacity="0.4" />

  <!-- Candlestick 1: Left Bearish (Red / Rose) -->
  <line x1="18" y1="20" x2="18" y2="46" stroke="#f43f5e" stroke-width="1.8" stroke-linecap="round" />
  <rect x="14.5" y="26" width="7" height="14" rx="1.5" fill="#f43f5e" />

  <!-- Candlestick 2: Center-Right Bullish (Green / Emerald) -->
  <line x1="33" y1="14" x2="33" y2="44" stroke="#10b981" stroke-width="1.8" stroke-linecap="round" />
  <rect x="29.5" y="20" width="7" height="16" rx="1.5" fill="#10b981" />

  <!-- Candlestick 3: Far-Right Bullish Impulsive -->
  <line x1="47" y1="8" x2="47" y2="36" stroke="#06b6d4" stroke-width="1.8" stroke-linecap="round" />
  <rect x="43.5" y="12" width="7" height="16" rx="1.5" fill="#06b6d4" />

  <!-- Upward Trendline & Breakout Arrow -->
  <path d="M 10 46 L 24 38 L 36 28 L 52 12" fill="none" stroke="url(#cyanLine)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <polygon points="54,10 47,12 52,17" fill="#06b6d4" />
</svg>
